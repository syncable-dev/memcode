name: Native Apple Silicon beta.12 production update proof
on:
  workflow_dispatch:
    inputs:
      expected_sha256:
        description: The approved beta.13 Mac updater SHA-256
        required: true
        type: string
permissions:
  contents: read
jobs:
  production-proof:
    if: github.repository == 'syncable-dev/memcode' && github.event.repository.private == true && github.ref == 'refs/heads/release/beta13-mac-upgrade-proof'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Exercise the released beta.12 executable and its normal production update path
        env:
          EXPECTED_UPDATER_SHA: ${{ inputs.expected_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_UPDATER_SHA" =~ ^[a-f0-9]{64}$ ]]
          test "$(uname -m)" = arm64
          mkdir "$RUNNER_TEMP/native-upgrade"
          cd "$RUNNER_TEMP/native-upgrade"
          curl --fail --silent --show-error --location --retry 3 'https://d12b8r6xagt10r.cloudfront.net/releases/memcode/0.4.0-beta.12/macos-aarch64/MemCode.app.tar.gz' -o previous.tar.gz
          echo '2b46e92c497bb06d35cfbdf9b86e2ce51dc3865bb6d781a20e034497c5ba387b  previous.tar.gz' | shasum -a 256 -c -
          mkdir "$HOME/Applications" -p
          test ! -e "$HOME/Applications/MemCode.app"
          tar -xzf previous.tar.gz -C "$HOME/Applications"
          APP="$HOME/Applications/MemCode.app"
          codesign --verify --deep --strict "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")" = '0.4.0-beta.12'
          swiftc "$GITHUB_WORKSPACE/.github/scripts/beta13-mac-update-ui.swift" -framework ApplicationServices -o ui-check
          export MEMCODE_DATA_DIR="$RUNNER_TEMP/native-upgrade/fresh-profile"
          mkdir -m 700 "$MEMCODE_DATA_DIR"
          "$APP/Contents/MacOS/memcode" </dev/null >"$RUNNER_TEMP/native-upgrade/app.stdout" 2>"$RUNNER_TEMP/native-upgrade/app.stderr" &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          ./ui-check "$APP_PID" "$RUNNER_TEMP/native-upgrade/ui.json" &
          UI_PID=$!
          for i in {1..120}; do
            test -f "$MEMCODE_DATA_DIR/updates/pending.json" && break
            kill -0 "$APP_PID"
            sleep 1
          done
          wait "$UI_PID"
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import os,json,sys
          r=Path(os.environ["RUNNER_TEMP"])/"native-upgrade"
          cache=Path(os.environ["MEMCODE_DATA_DIR"])/"updates"
          ui=json.loads((r/"ui.json").read_text())
          result={"nativePlatform":"darwin-arm64","installedVersion":"0.4.0-beta.12","productionAppLaunched":True,"userInterface":ui,"beta13SignedDownloadStagedByBeta12":False}
          journal=cache/"pending.json"
          if journal.is_file():
            pending=json.loads(journal.read_bytes())
            payload=cache/pending["directory"]/"signed-update"
            digest=sha256(payload.read_bytes()).hexdigest()
            result.update({"beta13SignedDownloadStagedByBeta12":pending["version"]=="0.4.0-beta.13" and digest==os.environ["EXPECTED_UPDATER_SHA"] and payload.stat().st_size==pending["length"],"offeredVersion":pending["version"],"sha256":digest,"bytes":pending["length"]})
          print(json.dumps(result,indent=2))
          (r/"proof.json").write_text(json.dumps(result,indent=2))
          if not (result["beta13SignedDownloadStagedByBeta12"] or ui["settingsShowsBeta13"]): sys.exit("beta.12 did not demonstrate the production beta.13 update")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: beta12-mac-production-update-proof
          path: |
            ${{ runner.temp }}/native-upgrade/proof.json
            ${{ runner.temp }}/native-upgrade/ui.json
          retention-days: 7
          if-no-files-found: warn
