[package]
name = "memcode"
version = "0.4.0-beta.24"
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"
rust-version = "1.90"
description = "The local Fleet Agentic Worker Suite"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["unstable"] }
tauri-plugin-updater = "=2.14.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "process", "sync", "time", "rt-multi-thread"] }
rfd = "=0.18.0"
base64 = "=0.23.1"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
dunce = "=1.0.5"
portable-pty = "=0.9.0"
keyring = "=4.2.0"
sha2 = "=0.10.9"

[dev-dependencies]
tauri = { version = "=2.12.5", features = ["test"] }

[target.'cfg(windows)'.dependencies]
wry = "=0.57.2"
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"
core-foundation = "=0.10.1"
wry = "=0.57.2"
objc2 = "=0.6.5"
block2 = "=0.6.2"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "NSString", "NSError", "NSData", "NSDictionary", "NSValue", "NSProcessInfo", "NSGeometry", "NSRange", "NSObjCRuntime", "NSURL", "NSArray"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-core-graphics", "NSEvent", "NSView", "NSResponder", "NSWindow", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSScreen", "NSTextInputClient"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKWebViewConfiguration", "WKContentWorld", "WKFrameInfo", "WKSnapshotConfiguration", "WKContentRuleList", "WKContentRuleListStore", "WKUserContentController", "WKNavigation"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGEvent", "CGEventTypes", "CGRemoteOperation"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFCGTypes"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
panic = "abort"
