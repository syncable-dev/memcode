[package]
name = "memcode"
version = "0.4.0-beta.17"
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"
rust-version = "1.90"
description = "The local Fleet Agentic Worker Suite"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["unstable"] }
tauri-plugin-updater = "=2.14.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "process", "sync", "time", "rt-multi-thread"] }
rfd = "=0.18.0"
base64 = "=0.23.1"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
dunce = "=1.0.5"
portable-pty = "=0.9.0"
keyring = "=4.2.0"
sha2 = "=0.10.9"

[dev-dependencies]
tauri = { version = "=2.12.5", features = ["test"] }

[target.'cfg(windows)'.dependencies]
wry = "=0.57.2"
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"
core-foundation = "=0.10.1"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
panic = "abort"
