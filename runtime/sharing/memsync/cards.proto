syntax = "proto3";

package memsync.v1;

import "google/protobuf/timestamp.proto";
import "memsync/v1/boards.proto";

// What happened on a card: the worker conversations, reviews and results MemCode writes
// there, and the files they refer to.
//
// Each card has its own log. Every entry gets the next number in that card's log, the
// time MemSync logged it and the account that sent it, once. MemSync never looks inside
// an entry. A file is kept per project under the SHA-256 of its bytes.
//
// Calls are signed in and turned down as in the Projects service. Anyone on the project
// can read and add. Messages of this service may be up to 6 MiB.
service Cards {
  // Adds entries to the end of a card's log. An entry whose id is already in that log
  // is not added again, so a call can be sent again when its answer was lost.
  rpc AppendCardEntries(AppendCardEntriesRequest) returns (AppendCardEntriesResponse);
  // Reads the next page of a card's log after a number, oldest first. An empty page
  // means there is nothing newer.
  rpc ReadCardEntries(ReadCardEntriesRequest) returns (ReadCardEntriesResponse);
  // Sends everything in a card's log after a number, then every new entry as it is
  // logged, until the caller hangs up or is no longer on the project.
  rpc WatchCardEntries(WatchCardEntriesRequest) returns (stream CardEntry);
  // Keeps a file for the project. Sending a file the project already has adds nothing.
  rpc UploadFile(UploadFileRequest) returns (StoredFile);
  // Hands back a file the project keeps.
  rpc DownloadFile(DownloadFileRequest) returns (DownloadFileResponse);
}

message NewCardEntry {
  // A UUID chosen by the sender. Sending the same id again to the same card adds nothing.
  string id = 1;
  // MemCode's own record, at most 1 MiB. MemSync does not read it.
  bytes payload = 2;
}

message CardEntry {
  string id = 1;
  // Its place in the card's log, from 1, with no gaps.
  uint64 sequence = 2;
  // When MemSync logged it. Never earlier than the entry before it.
  google.protobuf.Timestamp logged_at = 3;
  // The `Person.account_id` of whoever sent it.
  string author_account_id = 4;
  bytes payload = 5;
}

message AppendCardEntriesRequest {
  string project_id = 1;
  // MemCode's id of the card: a UUID.
  string card_id = 2;
  // At most 100.
  repeated NewCardEntry entries = 3;
}

message AppendCardEntriesResponse {
  // One for each entry sent, in the order sent.
  repeated UpdateReceipt receipts = 1;
}

message ReadCardEntriesRequest {
  string project_id = 1;
  string card_id = 2;
  // 0 reads from the start.
  uint64 after_sequence = 3;
}

message ReadCardEntriesResponse {
  repeated CardEntry entries = 1;
}

message WatchCardEntriesRequest {
  string project_id = 1;
  string card_id = 2;
  // 0 watches from the start.
  uint64 after_sequence = 3;
}

message UploadFileRequest {
  string project_id = 1;
  // At most 5 MiB. A project keeps at most 50 MiB of files.
  bytes content = 2;
}

message StoredFile {
  // The SHA-256 of the content, 64 lower-case hex digits.
  string sha256 = 1;
  uint64 size = 2;
  // The `Person.account_id` of whoever uploaded it first.
  string uploaded_by_account_id = 3;
  google.protobuf.Timestamp uploaded_at = 4;
}

message DownloadFileRequest {
  string project_id = 1;
  string sha256 = 2;
}

message DownloadFileResponse {
  StoredFile file = 1;
  bytes content = 2;
}
